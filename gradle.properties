# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# The Fabric Loom version, read by the loom-back-compat plugin applied in
# settings.gradle.kts. It has to live here rather than in stonecutter.properties.toml
# because settings are evaluated before those properties are loaded.
loomx.loom_version=1.17.19

# Everything else — mod metadata and the per-version Minecraft/NeoForge/Fabric/Parchment
# versions — lives in stonecutter.properties.toml.
