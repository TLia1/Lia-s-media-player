# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# The Fabric Loom version, read by the loom-back-compat plugin applied in
# settings.gradle.kts. It has to live here rather than in stonecutter.properties.toml
# because settings are evaluated before those properties are loaded.
loomx.loom_version=1.17.19

# The single target the source-level quality checks run on: Checkstyle, JaCoCo, and
# -Werror. One src/ tree is compiled by all fourteen targets, so running them on more
# than one produces the same report fourteen times — and -Werror on all fourteen would
# turn every future Minecraft deprecation into a build failure on the versions that
# have not been ported yet, rather than a warning to work through.
#
# Keep it on the VCS target (`stonecutter active` in stonecutter.gradle.kts, and what
# `git` sees): that is the tree a reviewer reads and the one the docs describe.
quality.target=1.21.1-neoforge

# Everything else — mod metadata and the per-version Minecraft/NeoForge/Fabric/Parchment
# versions — lives in stonecutter.properties.toml.
