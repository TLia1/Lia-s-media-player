name: Build & Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # The build matrix lives in settings.gradle.kts and nowhere else. Parsing it
  # here keeps this workflow from silently drifting out of date — a target added
  # to Stonecutter but forgotten here would just stop being built, with a green
  # tick. This runs without Gradle, so it costs seconds rather than a minute.
  #
  # Each `match("<mc>", "<loader>", ...)` line expands to one subproject per
  # loader, named "<mc>-<loader>" — the same expansion settings.gradle.kts does.
  # The count is asserted below, so a change of shape that still parses (say, a
  # line losing a loader) fails loudly instead of quietly building less.
  targets:
    name: Collect targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.parse.outputs.targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse the Stonecutter build matrix
        id: parse
        run: |
          expanded=$(grep -oE '^[[:space:]]*match\("[^"]+"(,[[:space:]]*"[^"]+")+\)' settings.gradle.kts \
            | sed -e 's/.*match(//' -e 's/)$//' -e 's/"//g' -e 's/,[[:space:]]*/,/g' \
            | awk -F, 'NF > 1 { for (i = 2; i <= NF; i++) print $1 "-" $i }')
          targets=$(printf '%s\n' "$expanded" | grep . | jq -R . | jq -sc .)
          count=$(printf '%s\n' "$expanded" | grep -c .)
          if [ "$targets" = "[]" ] || [ -z "$targets" ]; then
            echo "::error::Could not parse the build matrix from settings.gradle.kts"
            exit 1
          fi
          # Every Minecraft version is built for both loaders; an odd count means a
          # match() line was parsed only in part.
          if [ $((count % 2)) -ne 0 ]; then
            echo "::error::Parsed $count targets from settings.gradle.kts, expected an even number (one per loader)"
            exit 1
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Building: $targets"

      # Stonecutter rewrites src/ in place for whichever target is active, so a commit
      # made from a switched tree carries every guard inverted — a diff touching most of
      # the mod, in which the actual change is invisible. `Reset active project` puts it
      # back; this is what notices when someone forgets, in seconds and without Gradle.
      - name: Check the committed tree is on the VCS target
        run: |
          active=$(grep -oE 'stonecutter active "[^"]+"' stonecutter.gradle.kts | sed -e 's/.*"\(.*\)"/\1/')
          expected=$(grep -oE '^quality\.target=.*' gradle.properties | cut -d= -f2)
          if [ -z "$active" ] || [ -z "$expected" ]; then
            echo "::error::Could not read the active Stonecutter target or quality.target"
            exit 1
          fi
          if [ "$active" != "$expected" ]; then
            echo "::error::src/ is committed switched to '$active'; expected '$expected'."
            echo "::error::Run './gradlew \"Reset active project\"' and commit the result."
            exit 1
          fi
          echo "Active target: $active"

  build:
    name: Build ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    strategy:
      # One target failing should not hide the state of the others.
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Two toolchains, because the range spans two of them: Minecraft 1.21.1
      # through 1.21.11 ship Java 21 to players and 26.1 moved to Java 25 (see
      # deps.java in stonecutter.properties.toml). 21 is listed last so it wins
      # JAVA_HOME and runs Gradle itself; the compile toolchain is picked per
      # version from the JAVA_HOME_*_X64 variables wired up below.
      - name: Setup Java 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Split from the build below on purpose: `build` runs the tests anyway (via
      # `check`), so a failing test used to surface as "the build failed" with the
      # reason somewhere in the log. As its own step it is named in the job list.
      #
      # `-Porg.gradle.java.installations.fromEnv`: Gradle does not look at setup-java's
      # install locations on its own, so point it at both explicitly. Without this it
      # would fall back to downloading a toolchain through the foojay resolver on every
      # 26.x job.
      - name: Test ${{ matrix.target }}
        run: |
          ./gradlew ":${{ matrix.target }}:test" \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Build ${{ matrix.target }}
        run: |
          ./gradlew ":${{ matrix.target }}:build" \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: Upload ${{ matrix.target }} jar
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar-${{ matrix.target }}
          path: versions/${{ matrix.target }}/build/libs/*.jar
          retention-days: 14

  # Checkstyle, -Werror and coverage, on the one target named by `quality.target` in
  # gradle.properties. All fourteen compile the same src/ tree, so this is once, not
  # fourteen times — and it is the tree as committed, which is what a reviewer reads.
  quality:
    name: Lint & coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read the quality target
        id: target
        run: echo "name=$(grep -oE '^quality\.target=.*' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Checkstyle
        run: |
          chmod +x gradlew
          ./gradlew ":${{ steps.target.outputs.name }}:checkstyleMain" \
                    ":${{ steps.target.outputs.name }}:checkstyleTest"

      - name: Tests and coverage
        run: ./gradlew ":${{ steps.target.outputs.name }}:jacocoTestReport"

      # No threshold, deliberately: most of this codebase is rendering and process
      # plumbing no unit test can reach, so a bar would be either meaningless or
      # counter-productive. The number is published so the direction is visible.
      - name: Report coverage
        if: always()
        run: |
          report="versions/${{ steps.target.outputs.name }}/build/reports/jacoco/test/jacocoTestReport.xml"
          [ -f "$report" ] || exit 0
          # The last counters in the document are the report-wide totals.
          line=$(grep -o '<counter type="LINE" missed="[0-9]*" covered="[0-9]*"/>' "$report" | tail -1)
          missed=$(echo "$line" | sed -e 's/.*missed="\([0-9]*\)".*/\1/')
          covered=$(echo "$line" | sed -e 's/.*covered="\([0-9]*\)".*/\1/')
          total=$((missed + covered))
          [ "$total" -gt 0 ] || exit 0
          echo "### Line coverage: $((100 * covered / total))% ($covered / $total)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            versions/${{ steps.target.outputs.name }}/build/reports/checkstyle
            versions/${{ steps.target.outputs.name }}/build/reports/jacoco
          retention-days: 14
